spring:
  application:
    name: backend

  config:
    import: optional:file:./.env[.properties]

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc.lob.non_contextual_creation: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}

app:
  uploads:
    # Local directory for uploaded files (images for sites). MVP-only —
    # will be swapped for S3 / R2 in prod. Override via APP_UPLOADS_DIR.
    dir: ${APP_UPLOADS_DIR:./uploads}
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:604800000}
  mail:
    from: ${MAIL_FROM:noreply@storinka.ua}
  url:
    backend: ${APP_BACKEND_URL:http://localhost:8080}
    frontend: ${APP_FRONTEND_URL:http://localhost:3000}
  google:
    # Audience expected on the Google ID token. Empty in dev = endpoint will
    # 401 — set this when wiring up Google sign-in.
    client-id: ${GOOGLE_CLIENT_ID:}

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: INFO
